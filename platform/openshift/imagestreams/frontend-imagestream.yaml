apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: frontend

spec:
  lookupPolicy:
    local: false

  tags:
    - name: dev

      from:
        kind: DockerImage
        name: docker.io/shaykekeidar/kub-demo-frontend:18

      importPolicy:
        scheduled: false

      referencePolicy:
        type: Source