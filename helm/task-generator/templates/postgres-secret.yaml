apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}

{{- if eq .Values.postgres.envStyle "openshift" }}
  POSTGRESQL_DATABASE: {{ .Values.postgres.database | quote }}
  POSTGRESQL_USER: {{ .Values.postgres.user | quote }}
  POSTGRESQL_PASSWORD: {{ .Values.postgres.password | quote }}
{{- end }}